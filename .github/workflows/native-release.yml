name: Native release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Native stable version
        default: '2.0.0'
        required: true
      bridge_version:
        description: Electron bridge version
        default: '1.19.0'
        required: true
      mode:
        description: Migration bridge or subsequent native update
        type: choice
        options: [migration, native]
        default: migration
      publish:
        description: Publish validated artifacts and live update feeds
        type: boolean
        default: false
  push:
    branches: [tauri-migration]
    paths: [.github/workflows/native-release.yml]
permissions:
  contents: read
concurrency:
  group: native-release
  cancel-in-progress: false
env:
  RELEASE_MODE: ${{ inputs.mode || 'migration' }}
  NATIVE_VERSION: ${{ inputs.version || '2.0.0' }}
  BRIDGE_VERSION: ${{ inputs.bridge_version || '1.19.0' }}
jobs:
  checks:
    uses: ./.github/workflows/migration-check.yml
    secrets: inherit
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libarchive-tools zstd gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: actions/checkout@v7.0.1
        with:
          repository: MinazukiAmane/Tia-Launcher-Helpers
          ref: edbd5d9fe15633e3251938213a4f2e428d4b66e3
          ssh-key: ${{ secrets.TIA_HELPER_SSH_KEY }}
          persist-credentials: false
          path: .private-helper
      - run: node build-scripts/prepareZig.mjs
      - run: node build-scripts/buildNativeLaunchers.cjs
      - name: Remove private helper sources
        if: always()
        shell: bash
        run: rm -rf .private-helper
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Prepare macOS targets and icons
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npx tauri icon build/icon.png --output src-tauri/icons
      - name: Import Developer ID for official macOS release
        if: runner.os == 'macOS' && inputs.publish
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: python3 migration/installer/prepare-apple-signing.py
      - name: Build native installer and Electron bridge
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TIA_MIGRATION_SIGNING_KEY: ${{ secrets.TIA_MIGRATION_SIGNING_KEY }}
          TIA_ASAR_KEY: ${{ secrets.TIA_ASAR_KEY }}
          TIA_OFFICIAL_MACOS: ${{ inputs.publish && '1' || '0' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOSX_DEPLOYMENT_TARGET: '14.6'
          CARGO_BUILD_JOBS: '2'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export GSTREAMER_PLUGINS_DIR="$(pkg-config --variable=pluginsdir gstreamer-1.0)"
            export GSTREAMER_HELPERS_DIR="$(pkg-config --variable=pluginscannerdir gstreamer-1.0)"
          fi
          node migration/installer/build-release.mjs "$NATIVE_VERSION" "$BRIDGE_VERSION" "$RELEASE_MODE"
      - name: Remove temporary signing material
        if: always() && runner.os == 'macOS' && inputs.publish
        run: python3 migration/installer/prepare-apple-signing.py --cleanup
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ runner.os }}
          path: release/candidate/
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release/combined
      - name: Verify signatures and generate separate update feeds
        run: |
          node migration/installer/merge-artifacts.mjs release/combined
          cargo run --manifest-path src-tauri/Cargo.toml --no-default-features --features release-tools --bin tia-release-verify -- release/combined "$NATIVE_VERSION"
          node migration/installer/release-layout.mjs release/combined release/publish "$NATIVE_VERSION" "$BRIDGE_VERSION" https://tia-launcher.serenetia.com/api/updates "$RELEASE_MODE"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: validated-release
          path: release/publish/
          retention-days: 14
      - name: Publish payloads before update metadata
        if: inputs.publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIA_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIA_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.TIA_S3_REGION }}
          TIA_S3_BUCKET: ${{ secrets.TIA_S3_BUCKET }}
          TIA_S3_ENDPOINT: ${{ secrets.TIA_S3_ENDPOINT }}
        run: |
          python3 -m pip install --disable-pip-version-check boto3
          python3 migration/installer/publish-release.py release/publish
