name: Build and publish Tia Launcher

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out private native helper
        uses: actions/checkout@v4
        with:
          repository: MinazukiAmane/Tia-Launcher-Helpers
          ref: 3985d8a225d3d6ec34df27c19e978da8859e3482
          ssh-key: ${{ secrets.TIA_HELPER_SSH_KEY }}
          persist-credentials: false
          path: .private-helper

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify private helper checkout
        run: node --test .private-helper/tests/cedar_checkout.test.cjs

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Build native helper
        run: node build-scripts/buildFlagLauncher.cjs

      - name: Remove private helper checkout
        if: always()
        shell: bash
        run: rm -rf .private-helper

      # pacman packaging (electron-builder's fpm-based target) needs
      # libarchive-tools' bsdtar on the runner.
      - name: Install pacman packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: npm ci

      - run: npm test

      - run: npm run ${{ matrix.script }}
        env:
          TIA_ASAR_KEY: ${{ secrets.TIA_ASAR_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.pacman
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: ignore

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Upload installers to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIA_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIA_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.TIA_S3_REGION }}
        run: |

          aws s3 sync installers/ "s3://${{ secrets.TIA_S3_BUCKET }}/" \
            --endpoint-url "${{ secrets.TIA_S3_ENDPOINT }}" \
            --exclude "latest*.yml" --exclude "*.blockmap" --delete --no-progress
          aws s3 sync installers/ "s3://${{ secrets.TIA_S3_BUCKET }}/" \
            --endpoint-url "${{ secrets.TIA_S3_ENDPOINT }}" \
            --exclude "*" --include "*.blockmap" --no-progress
          aws s3 sync installers/ "s3://${{ secrets.TIA_S3_BUCKET }}/" \
            --endpoint-url "${{ secrets.TIA_S3_ENDPOINT }}" \
            --exclude "*" --include "latest*.yml" --no-progress

      - name: Delete build artifacts now that they're on S3
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("installers-")) | .id' | \
          while read -r id; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Warm CDN cache for published files
        env:
          UPDATES_BASE: ${{ vars.TIA_UPDATES_BASE }}
        run: |
          if [ -z "$UPDATES_BASE" ]; then echo "TIA_UPDATES_BASE not set, skipping"; exit 0; fi
          cache_headers="$(mktemp)"
          trap 'rm -f "$cache_headers"' EXIT
          for f in installers/*; do
            name="$(basename "$f")"
            if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --head --dump-header "$cache_headers" --output /dev/null "$UPDATES_BASE/$name"; then
              echo "::warning::Could not check cache eligibility for $name"
              continue
            fi
            cache_status="$(awk 'tolower($1) == "cf-cache-status:" {gsub(/\r/, "", $2); print toupper($2)}' "$cache_headers" | tail -n 1)"
            if [[ "$name" != *.yml && ( "$cache_status" == "DYNAMIC" || "$cache_status" == "BYPASS" ) ]]; then
              echo "::warning::$name is not eligible for CDN cache ($cache_status). Enable a Cloudflare Cache Rule before prewarming."
              continue
            fi
            echo "Warming cache: $name (status: ${cache_status:-unknown})"
            if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 300 \
              --output /dev/null --write-out "  %{http_code} %{time_total}s\n" "$UPDATES_BASE/$name"; then
              echo "::warning::Cache warm failed or timed out for $name"
            fi
          done
