name: Promote validated native candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed native candidate workflow run
        required: true
      mode:
        type: choice
        options: [migration, native]
        default: native
      bridge_version:
        default: '1.19.2'
        required: true
      publish:
        description: Publish these exact tested artifacts and update feeds
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ${{ inputs.publish && 'tia-launcher-production-publish' || format('native-promotion-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - run: git config --global init.defaultBranch master
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Authenticate candidate provenance and platform checks
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: node migration/installer/validate-candidate.mjs "$CANDIDATE_RUN"
      - name: Download immutable artifacts and verify GitHub digests
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: node migration/installer/download-candidate.mjs "$CANDIDATE_RUN" release/combined
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Verify payload signatures and build update feeds
        env:
          EXPECTED_SOURCE: ${{ steps.candidate.outputs.source-sha }}
          BRIDGE_VERSION: ${{ inputs.bridge_version }}
          RELEASE_MODE: ${{ inputs.mode }}
          CARGO_BUILD_JOBS: '2'
        run: |
          node migration/installer/merge-artifacts.mjs release/combined
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("release/combined/release-artifacts.json"));if(m.metadata.commit!==process.env.EXPECTED_SOURCE)throw Error("Artifact source does not match its workflow");'
          version="$(node -p 'require("./package.json").version')"
          cargo run --manifest-path src-tauri/Cargo.toml --no-default-features --features release-tools --bin tia-release-verify -- release/combined "$version"
          node migration/installer/release-layout.mjs release/combined release/publish "$version" "$BRIDGE_VERSION" https://tia-launcher.serenetia.com/api/updates "$RELEASE_MODE"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: validated-release
          if-no-files-found: error
          path: release/publish/
          retention-days: 14
      - name: Publish tested artifacts before metadata
        if: inputs.publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIA_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIA_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.TIA_S3_REGION }}
          TIA_S3_BUCKET: ${{ secrets.TIA_S3_BUCKET }}
          TIA_S3_ENDPOINT: ${{ secrets.TIA_S3_ENDPOINT }}
        run: |
          python3 -m venv "$RUNNER_TEMP/tia-release-publisher"
          "$RUNNER_TEMP/tia-release-publisher/bin/python" -m pip install --disable-pip-version-check --require-hashes -r migration/installer/publisher-requirements.txt
          "$RUNNER_TEMP/tia-release-publisher/bin/python" migration/installer/publish-release.py release/publish
