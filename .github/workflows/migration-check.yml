name: Launcher checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch master
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gnome-keyring dbus-x11 at-spi2-core pipewire rtkit xdg-desktop-portal-gtk
      - name: Check out private native helper
        uses: actions/checkout@v7.0.1
        with:
          repository: MinazukiAmane/Tia-Launcher-Helpers
          ref: edbd5d9fe15633e3251938213a4f2e428d4b66e3
          ssh-key: ${{ secrets.TIA_HELPER_SSH_KEY }}
          persist-credentials: false
          path: .private-helper
      - name: Install verified Zig toolchain
        run: node build-scripts/prepareZig.mjs
      - name: Build native runtimes
        run: node build-scripts/buildNativeLaunchers.cjs
      - name: Remove private helper checkout
        if: always()
        shell: bash
        run: rm -rf .private-helper
      - run: npm ci
      - name: Cache verified build downloads
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          key: tia-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'migration/installer/prepare-build-downloads.mjs') }}
          restore-keys: tia-build-tools-${{ runner.os }}-${{ runner.arch }}-
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/tauri
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
      - name: Prepare checksum-verified build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: node migration/installer/prepare-build-downloads.mjs
      - name: Check Windows installer includes
        if: runner.os != 'macOS'
        run: node migration/installer/check-nsis-includes.mjs
      - name: Prepare Electron migration test runtime
        run: node node_modules/electron/install.js
      - name: Configure Electron sandbox for Linux tests
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - name: Test release publication ordering
        run: python -m unittest discover -s tests/packaging -p "test_*.py"
      - name: Prepare macOS bundle icons
        if: runner.os == 'macOS'
        run: npx tauri icon build/icon.png --output src-tauri/icons
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --features migration-helper --bin tia-migration-helper
      - name: Test encrypted database handoff
        run: npx vitest run --maxWorkers=2
      - name: Test real Electron safeStorage compatibility
        if: runner.os == 'Windows'
        run: npx electron migration/windows/electron-key-smoke.cjs src-tauri/target/debug/tia-migration-helper.exe
      - name: Test real Windows client startup for x86 and x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'tia-native-clients'
          $resources = Join-Path $fixture 'resources'
          New-Item -ItemType Directory -Force (Join-Path $resources 'client-runtime') | Out-Null
          Copy-Item 'build/native/csore-start-*.exe' (Join-Path $resources 'client-runtime')
          foreach ($architecture in @('x86', 'x64')) {
            $target = if ($architecture -eq 'x86') { 'x86-windows-gnu' } else { 'x86_64-windows-gnu' }
            & zig cc -target $target -O2 -s -Werror -municode '-Wl,--subsystem,windows' migration/windows/client-fixture.c -lshell32 -o (Join-Path $fixture "client-$architecture.exe")
            if ($LASTEXITCODE -ne 0) { throw "Could not build the $architecture first-party client fixture" }
          }
          $env:TIA_NATIVE_FIXTURE_DIR = $fixture
          $env:TIA_NATIVE_RESOURCE_DIR = $resources
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --test game_install windows_real_native_helpers_initialize_both_architectures_and_forward_options -- --ignored --exact
      - name: Test Linux key recovery from real Electron
        if: runner.os == 'Linux'
        run: python3 migration/tests/run-linux-key-recovery.py
      - name: Test macOS Electron key handoff
        if: runner.os == 'macOS'
        run: bash migration/tests/run-macos-key-recovery.sh
      - name: Check Windows desktop build
        if: runner.os == 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin tia-launcher --features tauri/custom-protocol
          export GSTREAMER_PLUGINS_DIR="$(pkg-config --variable=pluginsdir gstreamer-1.0)"
          export GSTREAMER_HELPERS_DIR="$(pkg-config --variable=pluginscannerdir gstreamer-1.0)"
          npx tauri bundle --debug --bundles appimage --ci
      - name: Test real AppImage startup and rollback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export TIA_NATIVE_STARTUP_SMOKE=1
          export TIA_NATIVE_STARTUP_BINARY="$(find "$PWD/src-tauri/target/debug/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$TIA_NATIVE_STARTUP_BINARY"
          python3 migration/tests/run-linux-native-smoke.py
      - name: Build macOS universal DMG
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.6'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          bash migration/installer/build-macos-ci.sh
      - name: Test real macOS migration and keychain persistence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export TIA_MACOS_NATIVE_BINARY="$(find "$PWD/src-tauri/target/universal-apple-darwin/release/bundle/macos" -path '*/Contents/MacOS/tia-launcher' -print -quit)"
          test -n "$TIA_MACOS_NATIVE_BINARY"
          bash migration/tests/run-macos-key-recovery.sh
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Tia-Launcher-mac-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
  nixos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch master
      - uses: actions/checkout@v7.0.1
      - name: Prepare clean Nix source
        run: |
          mkdir -p "$RUNNER_TEMP/tia-nix-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tia-nix-source"
      - name: Build and test NixOS package
        run: |
          docker run --rm --memory=6g --memory-swap=7g --cpus=2 \
            -v "$RUNNER_TEMP/tia-nix-source:/workspace:ro" -w /workspace \
            nixos/nix@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0 \
            nix --extra-experimental-features 'nix-command flakes' \
            flake check --no-write-lock-file --print-build-logs --max-jobs 1 --cores 2 path:/workspace
