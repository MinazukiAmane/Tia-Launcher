appId: com.serenetia.tia-launcher
productName: Tia Launcher
directories:
  output: release
  buildResources: build
electronLanguages: [en-US, id, zh-CN, ko, ja]
files:
  - out/**/*
  - package.json
  - "!tests/**"
  - "!**/*.test.*"

afterPack: build-scripts/afterPack.js
# afterPack replaces app.asar with encrypted app.dat.
disableSanityCheckAsar: true

publish:
  provider: generic
  url: https://tia-launcher.serenetia.com/api/updates
  channel: latest

extraResources:
  - from: build/native
    to: client-runtime
    filter:
      - "csore-start-*.exe"
  - from: build/native/cedar
    to: game-runtime
    filter:
      - "cedar-start-x64.exe"
      - "cedar-client-x64.dll"
      - "LICENSE-Minhook.txt"
      - "launcher-services.json"
  - from: build/icon.png
    to: icon.png

artifactName: "Tia-Launcher-${version}-${os}-${arch}.${ext}"

win:
  target: nsis
  # Embeds a Windows manifest that always triggers the UAC elevation
  # prompt when the exe is launched, every time, with no "run as admin"
  # right-click needed -- matches perMachine below (an all-users,
  # Program-Files install genuinely needs elevated writes at runtime too,
  # not just at install time).
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  # Forces an all-users install (Program Files, elevation required at
  # install time) and removes the "Install for all users / just for me"
  # choice NSIS otherwise shows when this is left unset.
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

mac:
  target: dmg
  category: public.app-category.games

linux:
  target:
    - AppImage
    - deb
    - pacman
  category: Game
  maintainer: Serenetia <amane@serenetia.com>
  syncDesktopName: true
  icon: build/icons
