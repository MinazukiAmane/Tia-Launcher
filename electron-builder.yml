appId: com.serenetia.tia-launcher
productName: Tia Launcher
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json

publish:
  provider: generic
  url: https://tia-launcher.serenetia.com/api/updates
  channel: latest

extraResources:
  - from: build/icon.png
    to: icon.png

artifactName: "Tia-Launcher-${version}-${os}-${arch}.${ext}"

win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

mac:
  target: dmg
  category: public.app-category.games

linux:
  target:
    - AppImage
    - deb
    - pacman
  category: Game
  maintainer: Serenetia <amane@serenetia.com>
  syncDesktopName: true
  icon: build/icons
