appId: com.serenetia.csore-launcher
productName: CSORE Launcher
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json

extraResources:
  - from: build/icon.png
    to: icon.png

artifactName: "CSORE-Launcher-${version}-${os}-${arch}.${ext}"

win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

mac:
  target: dmg
  category: public.app-category.games

linux:
  target:
    - AppImage
    - deb
    - pacman
  category: Game
  maintainer: Serenetia <amane@serenetia.com>
  syncDesktopName: true
  icon: build/icons
